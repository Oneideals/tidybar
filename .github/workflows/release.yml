name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Package DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Tests (tidybar-checks)
        run: swift run tidybar-checks

      - name: Generate DMG Package
        run: ./scripts/package-dmg.sh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
